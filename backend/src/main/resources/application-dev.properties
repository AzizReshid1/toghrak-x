# =============================================================================
# DEV PROFILE OVERRIDES
# Activate with: -Dspring.profiles.active=dev  (IntelliJ Run Config)
#             or: SPRING_PROFILES_ACTIVE=dev    (environment variable)
#
# These settings are intentionally unsafe for production and must NEVER be
# used outside of local development.
# =============================================================================

# Allow Hibernate to create/alter tables automatically during development.
# Production uses 'validate' (set in application.properties).
spring.jpa.hibernate.ddl-auto=update

# Print formatted SQL to the console for debugging.
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Include exception messages in error responses for easier local debugging.
# Production uses 'never' to prevent leaking internal details.
server.error.include-message=always

# Disable secure cookie in local dev (no HTTPS on localhost).
app.refresh.cookie.secure=false
