# Application Name
spring.application.name=Toghrak X

# -------------------------------
# DATABASE CONFIGURATION
# -------------------------------
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# -------------------------------
# IMAGE UPLOAD AND ACCESS
# -------------------------------
# Base directory for uploaded images. A relative path is resolved against the project root
# (the folder containing "backend" and "frontend"); set IMAGE_UPLOAD_DIR to an absolute path in production.
app.image.upload-dir=${IMAGE_UPLOAD_DIR:uploads}

# Base URL for accessing images (for local development you might use something like http://localhost:8081/images/)
app.image.base-url=${IMAGE_BASE_URL:http://localhost:8081/images/}


# -------------------------------
# HIKARICP (CONNECTION POOL) SETTINGS
# -------------------------------
spring.datasource.hikari.auto-commit=false
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.maximum-pool-size=15
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.max-lifetime=1800000
# Connection timeout in milliseconds (20 seconds)
spring.datasource.hikari.connection-timeout=20000

# -------------------------------
# JPA / HIBERNATE SETTINGS
# -------------------------------
# Flyway owns the schema (src/main/resources/db/migration); Hibernate only validates it against the entities.
spring.jpa.hibernate.ddl-auto=validate
# SQL logging is OFF by default — it is verbose and can log sensitive parameter values.
# Enabled only in the dev profile via application-dev.properties.
spring.jpa.show-sql=false
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true
spring.jpa.properties.hibernate.default_batch_fetch_size=50
spring.jpa.open-in-view=false
spring.sql.init.mode=never

# -------------------------------
# FLYWAY (DATABASE MIGRATIONS)
# -------------------------------
# Migrations run automatically on startup from classpath:db/migration.
# A database that already has tables but no Flyway history (created earlier by ddl-auto=update)
# is marked as being at V1 instead of re-running V1__init.sql. An empty database runs V1 normally.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

# -------------------------------
# JWT CONFIGURATION
# -------------------------------
# JWT secret should be at least 64 characters long for HS512.
# For production, set JWT_SECRET env. The default below is only for local dev.
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration=${JWT_EXPIRATION:1800000}
app.refresh.expiration=${REFRESH_EXPIRATION:43200000}
app.refresh.cookie.secure=${REFRESH_COOKIE_SECURE:true}
app.refresh.cookie.domain=${REFRESH_COOKIE_DOMAIN:}

# -------------------------------
# DEFAULT ADMIN CREDENTIALS (FOR DATA SEEDING)
# The very first admin username and userpassword created on app startup (DEFAULT_ADMIN_USERNAME, DEFAULT_ADMIN_EMAIL,DEFAULT_ADMIN_PASSWORD)
# -------------------------------
default.admin.username=${DEFAULT_ADMIN_USERNAME:admin}
default.admin.email=${DEFAULT_ADMIN_EMAIL:admin@example.com}
default.admin.password=${DEFAULT_ADMIN_PASSWORD:}


# -------------------------------
# SERVER SETTINGS
# -------------------------------
server.port=8081
# Never expose raw exception messages to clients in production — they leak internal details.
# The dev profile overrides this to 'always' for easier local debugging.
server.error.include-message=never
server.error.whitelabel.enabled=false

# -------------------------------
# MULTIPART / UPLOAD LIMITS
# -------------------------------
# Increase if logo/image uploads are rejected with MaxUploadSizeExceededException
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# -------------------------------
# SECURITY TOGGLES
# -------------------------------
# Set to false in production to restrict Swagger to ADMIN only
app.security.swagger-public=false

# -------------------------------
# CORS CONFIGURATION
# -------------------------------
# Comma-separated list of allowed frontend origins.
# Override via CORS_ALLOWED_ORIGINS env var in production (e.g. https://yourdomain.com).
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200}
