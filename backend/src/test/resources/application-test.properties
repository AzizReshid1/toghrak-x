# Test profile: the database comes from Testcontainers (see TestcontainersConfiguration).
# Fixed secret for tests only; never used outside the test run.
app.jwt.secret=test-only-jwt-secret-that-is-long-enough-for-hs512-signing-0123456789abcdef

# Uploaded test images go to a temporary folder, never to the real uploads directory.
app.image.upload-dir=${java.io.tmpdir}/toghrakx-test-uploads
