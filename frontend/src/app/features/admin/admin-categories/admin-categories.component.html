<div class="container mt-6">
  <h4>Categories</h4>
  @if (loading) {
    <div class="alert alert-info">Loading...</div>
  }
  @if (error) {
    <div class="alert alert-error">{{ error }}</div>
  }

  <form class="flex flex-wrap gap-2 mb-4" (ngSubmit)="save()">
    <div class="w-full sm:w-1/3">
      <input
        class="input"
        [(ngModel)]="form.name"
        name="name"
        placeholder="Category name"
        required
        />
    </div>
    <div class="w-full sm:w-1/2">
      <input
        class="input"
        [(ngModel)]="form.description"
        name="description"
        placeholder="Description (optional)"
        />
    </div>
    <div class="w-full sm:w-1/6 grid">
      <button class="btn btn-brand btn-sm" type="submit" [disabled]="saving">
        {{ saving ? "..." : (editingId ? "Update" : "Add") }}
      </button>
    </div>
    @if (editingId) {
      <div class="w-full sm:w-1/6">
        <button type="button" class="btn btn-outline btn-sm w-full" (click)="cancelEdit()">
          Cancel
        </button>
      </div>
    }
  </form>

  <div class="admin-table-wrap">
    <table class="data-table">
      <thead>
        <tr>
          <th>Name</th>
          <th>Description</th>
          <th class="col-actions"></th>
        </tr>
      </thead>
      <tbody>
        @for (c of categories; track c.id) {
          <tr>
            <td>{{ c.name }}</td>
            <td>{{ c.description }}</td>
            <td>
              <div class="flex gap-1">
                <button class="btn btn-outline btn-sm" (click)="startEdit(c)">Edit</button>
                <button class="btn btn-danger btn-sm" (click)="remove(c.id)">Delete</button>
              </div>
            </td>
          </tr>
        }
        @if (!loading && !categories.length) {
          <tr>
            <td colspan="3" class="text-gray-500 text-center">No categories yet.</td>
          </tr>
        }
      </tbody>
    </table>
  </div>
</div>
