<div class="container mt-6">
  <h4>Social Links</h4>
  <table class="social-table data-table">
    <thead>
      <tr>
        <th class="col-label">Label</th>
        <th>URL</th>
        <th class="col-icon">Icon</th>
        <th class="col-actions"></th>
      </tr>
    </thead>
    <tbody>
      @for (link of links; track link) {
        <tr>
          <td><input class="input input-sm" [(ngModel)]="link.label" /></td>
          <td><input class="input input-sm" [(ngModel)]="link.url" /></td>
          <td><input class="input input-sm" [(ngModel)]="link.icon" placeholder="Optional" /></td>
          <td>
            <div class="flex gap-1">
              <button class="btn btn-success btn-sm" type="button" (click)="save(link)" [disabled]="saving">Save</button>
              <button class="btn btn-danger btn-sm" type="button" (click)="remove(link)">Delete</button>
            </div>
          </td>
        </tr>
      }
      @if (!links.length) {
        <tr>
          <td colspan="4" class="text-gray-500 text-center">No links added yet.</td>
        </tr>
      }
    </tbody>
  </table>
  <button class="btn btn-brand btn-sm mt-3" type="button" (click)="add()">Add link</button>
</div>
