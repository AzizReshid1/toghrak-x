<div class="container mt-6">
  <h4>Users</h4>
  @if (loading) {
    <div class="alert alert-info">Loading...</div>
  }
  @if (error) {
    <div class="alert alert-error">{{ error }}</div>
  }

  <form class="flex flex-wrap gap-2 mb-4" (ngSubmit)="create()">
    <div class="w-full sm:w-1/4">
      <input
        class="input"
        [(ngModel)]="form.username"
        name="username"
        placeholder="Username"
        required
        />
    </div>
    <div class="w-full sm:w-1/4">
      <input
        class="input"
        [(ngModel)]="form.email"
        name="email"
        placeholder="Email"
        required
        />
    </div>
    <div class="w-full sm:w-1/4">
      <input
        type="password"
        class="input"
        [(ngModel)]="form.password"
        name="password"
        placeholder="Password"
        required
        />
    </div>
    <div class="w-full sm:w-1/6">
      <select class="form-select" [(ngModel)]="form.roleName" name="roleName">
        <option value="EDITOR">EDITOR</option>
        <option value="ADMIN">ADMIN</option>
      </select>
    </div>
    <div class="w-full sm:w-[8.333%] grid">
      <button class="btn btn-brand btn-sm" type="submit" [disabled]="saving">
        {{ saving ? "..." : "Add" }}
      </button>
    </div>
  </form>

  <table class="data-table">
    <thead>
      <tr>
        <th>Username</th>
        <th>Email</th>
        <th>Role</th>
        <th style="width: 80px"></th>
      </tr>
    </thead>
    <tbody>
      @for (u of users; track u) {
        <tr>
          <td>{{ u.username }}</td>
          <td>{{ u.email }}</td>
          <td>{{ u.roleName }}</td>
          <td>
            <button class="btn btn-danger btn-sm" (click)="delete(u.id)">Delete</button>
          </td>
        </tr>
      }
    </tbody>
  </table>
</div>
