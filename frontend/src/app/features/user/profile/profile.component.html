@if (!loading) {
  <div class="container mt-6 page-narrow">
    <h4 class="mb-4">Profile</h4>
    @if (error) {
      <div class="alert alert-error">{{ error }}</div>
    }
    @if (user) {
      <div class="card">
        <div class="card-body">
          <dl class="flex flex-wrap mb-0">
            <dt class="w-full sm:w-1/3">Username</dt>
            <dd class="w-full sm:w-2/3">{{ user.username }}</dd>
            <dt class="w-full sm:w-1/3">Email</dt>
            <dd class="w-full sm:w-2/3">{{ user.email }}</dd>
            @if (user.roleName) {
              <dt class="w-full sm:w-1/3">Role</dt>
              <dd class="w-full sm:w-2/3">{{ user.roleName }}</dd>
            }
          </dl>
        </div>
      </div>
    }
  </div>
} @else {
  <div class="container mt-6"><div class="alert alert-info">Loading...</div></div>
}
